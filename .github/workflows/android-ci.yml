name: VELLORA CUT CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Caches ~/.gradle (downloaded dependencies) and the Gradle build
      # cache between runs, keyed off gradle files — a run with no
      # dependency changes reuses everything instead of re-downloading.
      # NDK/CMake install step removed: the old native C++ engine
      # (cpp/, NativeEngine.kt) was deleted when the manual Editor was
      # removed, so nothing in this build needs the NDK toolchain anymore
      # — ffmpeg-kit's native libraries ship prebuilt, no compiling here.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vellora-cut-debug-apk
          path: app/build/outputs/apk/debug/*.apk
