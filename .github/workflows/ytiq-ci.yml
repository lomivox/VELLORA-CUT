name: YTIQ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release for the in-app Update button? Leave OFF for a test APK only."
        type: boolean
        default: false

permissions:
  contents: write

env:
  # true = publish (every push to main, or a manual run with "publish" ticked). Pull requests never publish.
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
  APP_NAME: YTIQ
  # PUBLIC repository (only APKs live there) that the app's Update button reads.
  # Must match AppUpdater.REPO in app/src/main/java/com/vellora/cut/update/AppUpdater.kt (same repo as VELLORA CUT; tags tell the apps apart)
  RELEASES_REPO: lomivox/VELLORA-CUT-releases
  # true when the secret RELEASES_TOKEN exists (a token that may write to RELEASES_REPO).
  HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release notes list what changed since the previous push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Version numbers start at 1001 so a new build is always higher than any older install of this app id.
      - name: Version number
        run: echo "APP_CODE=$((${{ github.run_number }} + 1000))" >> "$GITHUB_ENV"

      # Signed with the fixed keystore in the repo (app/keystore/vellora-shared.keystore) = TEMPORARY testing key.
      # versionCode = run number (only ever goes up), so every build installs as an update over the last one.
      - name: Build debug APK
        env:
          VERSION_CODE: ${{ env.APP_CODE }}
          VERSION_NAME: 0.1.${{ env.APP_CODE }}
        run: ./gradlew assembleYtiqDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew testYtiqDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Name the APK
        run: |
          APK="${APP_NAME}-v0.1.${{ env.APP_CODE }}.apk"
          cp app/build/outputs/apk/ytiq/debug/app-ytiq-debug.apk "$APK"
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"

      # Always kept as a private download (1 day), even when a release is also published.
      - name: Keep the APK as a private download
        uses: actions/upload-artifact@v4
        with:
          name: ytiq-debug-apk
          path: ${{ env.APK_FILE }}
          retention-days: 1

      - name: Describe this build (what changed)
        if: env.PUBLISH == 'true'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="HEAD~1"
          fi
          {
            echo "What changed:"
            git log --no-merges --pretty='- %s' "$BEFORE..HEAD" | grep -v "skip ci" | head -20
          } > release-notes.md
          cat release-notes.md

      - name: Publish release for the in-app update (public releases repository)
        if: env.PUBLISH == 'true' && env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_TOKEN }}
          repository: ${{ env.RELEASES_REPO }}
          target_commitish: main
          make_latest: false
          tag_name: ytiq-v0.1.${{ env.APP_CODE }}
          name: YTIQ v0.1.${{ env.APP_CODE }}
          body_path: release-notes.md
          files: ${{ env.APK_FILE }}

      # The releases repository holds exactly ONE thing: the newest YTIQ APK. Every other release/tag is deleted.
      - name: Keep only this one release (delete every other release and tag)
        if: env.PUBLISH == 'true' && env.HAS_RELEASES_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          KEEP="ytiq-v0.1.${{ env.APP_CODE }}"
          gh release list --repo "$RELEASES_REPO" --limit 200 --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$KEEP" ]; then
              echo "Deleting old release $tag"
              gh release delete "$tag" --repo "$RELEASES_REPO" --cleanup-tag --yes
            fi
          done

      - name: Warn when the in-app update is not set up
        if: env.PUBLISH == 'true' && env.HAS_RELEASES_TOKEN != 'true'
        run: echo "::warning::Secret RELEASES_TOKEN is missing, so this build was NOT published for the app's Update button."
